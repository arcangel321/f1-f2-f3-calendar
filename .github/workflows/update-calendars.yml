name: Update F1 F2 F3 calendars

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update calendars
        run: python scripts/update_calendars.py

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add f1.ics f2.ics f3.ics

          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update F1 F2 F3 calendars"
            git push
          fi
